name: Privacy scan

on:
  pull_request:
  push:

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Scan tracked files and history
        run: python scripts/privacy_scan.py --history
